# Render Blueprint — deploy with New > Blueprint, or configure a Web Service
# manually using the build/start commands below.
services:
  - type: web
    name: spice-route-ops
    runtime: node
    plan: free
    region: singapore          # closest to the Hyderabad team
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.11.1
      - key: NODE_ENV
        value: production
